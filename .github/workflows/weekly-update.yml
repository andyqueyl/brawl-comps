name: Weekly data update

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC (9am Chicago in summer, 8am in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull battles and squad profiles
        env:
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
        run: node scripts/update.mjs
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly data update $(date -u +%Y-%m-%d)"
          git push
