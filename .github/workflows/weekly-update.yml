name: Data update

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC: top-player meta + squad
    - cron: "0 9 * * *"  # every day 09:00 UTC: squad games only (the API only shows each player's last 25)
  workflow_dispatch:
    inputs:
      squad_only:
        description: "Only refresh squad profiles"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull data
        env:
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
          SQUAD_ONLY: ${{ (github.event.schedule == '0 9 * * *' || inputs.squad_only) && '1' || '' }}
        run: node scripts/update.mjs
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(date -u +%Y-%m-%d)${SQUAD_ONLY:+ (squad)}"
          git push
        env:
          SQUAD_ONLY: ${{ (github.event.schedule == '0 9 * * *' || inputs.squad_only) && '1' || '' }}
