<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Best Brawl Stars comps for every map, picked from the brawlers our squad actually owns. Refreshed weekly from top-player battle logs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Cpath d='M48 6l36 14v26c0 22-15 38-36 44C27 84 12 68 12 46V20z' fill='%23ffc61a' stroke='%2314121a' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M52 24L34 52h13l-4 22 19-30H49z' fill='%2314121a'/%3E%3C/svg%3E">
<title>Brawl Comps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#/">
      <svg viewBox="0 0 96 96" aria-hidden="true"><path d="M48 6l36 14v26c0 22-15 38-36 44C27 84 12 68 12 46V20z" fill="var(--accent)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/><path d="M52 24L34 52h13l-4 22 19-30H49z" fill="var(--ink)"/></svg>
      <span>Brawl Comps</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-tab="maps">Maps</a>
      <a href="#/squad" data-tab="squad">Squad</a>
      <a href="#/about" data-tab="about">How it works</a>
    </nav>
  </div>
</header>

<section class="squadbar">
  <div class="wrap squadbar-in">
    <span class="label">Who's on?</span>
    <div class="chips" id="who"></div>
    <label class="power">
      <span>Min power</span>
      <select id="minPower">
        <option value="1">Any</option>
        <option value="7">7+</option>
        <option value="9">9+</option>
        <option value="10">10+</option>
        <option value="11">11</option>
      </select>
    </label>
  </div>
</section>

<main class="wrap" id="view" aria-live="polite"></main>

<footer class="wrap foot" id="foot"></footer>

<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
